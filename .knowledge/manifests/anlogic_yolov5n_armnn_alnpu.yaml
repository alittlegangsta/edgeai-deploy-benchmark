  benchmark_gate: "NOT_SATISFIED"
  next_minimum_action: "Reopen only after a generic-quantized-layer Alnpu backend, an APUG1205-compatible compiler/native runtime, or an official DR1M90 GEG400 YOLO deployment chain is supplied; do not substitute YOLOv5s, accept CPU fallback, or claim a benchmark."
  positive_control: "Official yolo_face_uint8_15.onnx is a separate opset14 QDQ graph and was previously assigned Alnpu/ALHardNPU by the vendor demo; it is not a YOLOv5n substitute."
  export_matrix: "The frozen opset12 baseline is unchanged. Six historical opset10/11/12 entries and four C2 opset13/14 entries (constant folding on/off) pass ONNX checker and local ORT exact raw comparison; C2 remains host-only."
  parser_bisection: "Minimal graph probes isolate explicit Floor/Identity/INT64 shape/Resize/FP32 Conv limitations; a minimal QDQ graph reaches Alnpu LoadNetwork. Exact Floor rewrites still SIGSEGV only in the larger YOLOv5n graph."
  native_path: "APUG1205 native conversion was not executed because convert_tool, al_ai_flow, native runtime headers/library, and the documented YOLOv5s positive-control assets were not found in the audited scopes."
  track_c_host_smoke: "The isolated vendor-requirements environment runs unmodified AL_onnx_pass and emits the three-head FP32 plus uint8 QDQ graphs. C1 is PASS; C2 remains NOT_ACCEPTED because the independent host gate fails."
  track_c2_host_gate: "All four opset13/14 official uint8/int8 graphs pass checker and ORT; both fail the separate eight-image held-out teacher-relative task gate. No ground-truth mAP is claimed."
  track_c3_board_smoke: "The opset14 uint8 candidate was copied only to board /tmp and run once with Alnpu-only. Parser/network creation passed, but Optimize rejected QAsymmU8 Conv2d, Activation and ElementwiseBinary; LoadNetwork, raw heads and detections were not reached."
  track_c3_int8_board_smoke: "The opset14 INT8 candidate was copied only to board /tmp and run once with Alnpu-only. Parser/network creation passed, but Optimize rejected QSymmS8 Conv2d, Activation and ElementwiseBinary; LoadNetwork, raw heads and detections were not reached."
  track_c3_operator_matrix: "The 12 synthetic UINT8/INT8 QDQ probes all exited 139 immediately after parser_created with no severe dmesg delta. The matrix is explicitly inconclusive because its synthetic QDQ dialect is not equivalent to the full AL_onnx_pass graph."
  track_c3_version_audit: "dr1m90_npu release commit 199ef4d and AL_onnx_pass.py SHA f61bc7... were compared with board ArmNN v32.1.0/.version ed5ae24 and library hashes; runtime/toolchain skew is not proven."
  track_c3_runtime_compatibility: "The release armnn_lib archive and the board's six compared ArmNN/Parser/Protobuf/timeline libraries are byte-identical. A temporary LD_LIBRARY_PATH/LD_DEBUG run proves candidate loading; matched-runtime face parser/load succeeds, but matched-runtime YOLOv8n Alnpu-only Optimize still fails QAsymmU8 Splitter."
  track_c3_hpf_d20_comparison: "The 05-5 tutorial-selected HPF embeds system.bit e40536... for DR1M90GEG400 and enables NPU_SOFT/SOFT_NN/SOFT_YOLO/SOFT_RESIZE; the official D20.1 AD101V20 HPF embeds a different GEG484 bitstream, address/IRQ/VDMA mapping and SOFT_RESIZE=0. Direct D20.1 substitution is rejected; runtime skew remains unproven."
  track_c3_controls: "The previously successful yolo_face_uint8_15.onnx has no Split; the release YOLOv8n control adds eight Split operators and fails QAsymmU8 Splitter Optimize. These controls show graph/operator coverage differences, not a YOLOv5n substitute."
  track_c3_support_boundary: "Static libarmnn.so.32.1 dispatch recovers ten AlnpuLayerSupport overrides; Conv2d/Activation/Splitter/Addition/Multiplication/ElementwiseUnary slots resolve to LayerSupportBase default rejection methods. The face positive reports three Alnpu|ALHardNPU fused/custom assignments, while real vendor YOLOv8n fails first at QAsymmU8 Splitter and YOLOv5n UINT8/INT8 fail at quantized Conv2d/Activation/ElementwiseBinary. This is a scoped compiled support-boundary result, not synthetic probe evidence."
  track_c4_benchmark: "NOT_RUN; no timing, FPS, CPU or RSS result is claimed."
  vendor_positive_control: "The checked release checkout's run_yolo_pic.sh uses yolov8n.quant.onnx; the requested yolov5s_320_sigmoid.onnx/net_config_yolov5s.json pair is absent from the bounded local scopes."
  softnpu_ip: "The tutorial platform bitstream statically carries NPU_SOFT=1, SOFT_NN=1, SOFT_YOLO=1 and SOFT_RESIZE=1; this is hardware-side evidence, not compiler/runtime evidence."
