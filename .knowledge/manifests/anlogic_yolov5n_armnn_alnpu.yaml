documented_facts:
  - "Task 026 vendor demo assigned its separate QDQ face graph to Alnpu/ALHardNPU with CPU fallback disallowed."
  - "The official AL_onnx_pass source is an ArmNN/ONNX simplification, Detect-crop, checker and static-QDQ preparation path, not the native npu_runtime compiler."
  - "Track C2 opset13/14 same-weight static640 exports pass ONNX/ORT raw-output checks and resolve the opset12 int8 axis graph error."
  - "Track C2 held-out class-multiset agreement is 87.5% for both uint8 and int8; the computed task-level quantization gate remains false."
  - "The opset14 INT8 candidate reaches ArmNN parser and network creation but Alnpu-only Optimize rejects QSymmS8 Conv2d, Activation and ElementwiseBinary before LoadNetwork."
  - "The release YOLOv8n quantized control reaches parser and network creation but Alnpu-only Optimize rejects QAsymmU8 Splitter; it does not prove a version skew."
  - "The release ArmNN archive copy is byte-identical to all six compared board runtime libraries and the ed5ae24 marker; a matched-runtime temporary YOLOv8n Alnpu-only run still fails QAsymmU8 Splitter."
  - "The 05-5 tutorial package targets DR1M90GEG400 with NPU_SOFT=1, SOFT_NN=1, SOFT_YOLO=1 and SOFT_RESIZE=1; the official D20.1 AD101V20 example targets DR1M90GEG484 and has different SoftNPU/VDMA resources and SOFT_RESIZE=0."
  - "Static readelf/objdump evidence recovers ten actual AlnpuLayerSupport Is*Supported overrides; Conv2d, Activation, Splitter, Addition, Multiplication and ElementwiseUnary vtable slots resolve to LayerSupportBase default rejection methods in the matched libarmnn.so.32.1 binary."
  - "The official yolo_demo_pic plus vendor YOLOv8n reaches ArmNN parser/model creation but fails Alnpu Optimize on QAsymmU8 Splitter; this is retained real-graph evidence, not a process-exit-only inference."
source_code_facts:
  - "The Task 028 runner passes only Alnpu to ArmNN Optimize and exposes a hash-pinned parse-only mode."
assumptions:
  - "The positive-control model remains an external vendor asset and is not the frozen YOLOv5n contract."
conflicts:
  - "The positive-control Resize spelling cannot be copied into the frozen opset-12 graph without an opset-aware conversion."
unresolved_blockers:
  - "Vendor ArmNN/Alnpu parser support or conversion for the frozen YOLOv5n graph is missing."
  - "APUG1205 native compiler/runtime release and positive-control conversion assets are unavailable in the audited local and VM scopes."
  - "The official uint8 QDQ output generated by AL_onnx_pass runs on host ORT but fails the frozen golden correctness gate; a vendor-supported calibration/quantization closure is still missing."
  - "The best opset14 uint8 candidate was sent to the board in RAM with Alnpu-only; ArmNN parsed the graph but rejected QAsymmU8 Conv2d, Activation and ElementwiseBinary during Optimize, before LoadNetwork."
  - "The best opset14 INT8 candidate was sent to the board in RAM with Alnpu-only; ArmNN parsed the graph but rejected QSymmS8 Conv2d, Activation and ElementwiseBinary during Optimize, before LoadNetwork."
  - "The available release runtime does not provide an independent NEW runtime identity: six compared shared-library hashes match the board exactly."
  - "The temporary matched-runtime official YOLOv8n Alnpu-only run reaches parser/model creation but fails Optimize with Failed to assign a backend to each layer (QAsymmU8 Splitter); the vendor process catches the exception and returns zero."
  - "The D20.1 AD101V20/GEG484 HPF and bitstream are not valid direct substitutes for the 05-5 DR1M90GEG400 package; the hardware-dialect comparison does not prove runtime/toolchain skew."
  - "The matched runtime binary contains explicit generic LayerSupportBase rejection paths for several required layer types; the precise backend support whitelist is compiled into the binary, while the original ArmNN backend source is unavailable in the audited scopes."
  - "A 12-entry synthetic QDQ operator matrix (Conv2d, Activation, Add, Mul, Concat, Resize; UINT8/INT8) is parser-dialect inconclusive because every graph segfaulted immediately after parser_created; it is not per-operator support evidence."
  - "C2 held-out quantization gates remain blocked; no local ground-truth annotations exist, so true dataset mAP is not computable and teacher-relative metrics are diagnostic only."
proposed_action: "Keep C1 conversion PASS, C2 quantized accuracy NOT_ACCEPTED, C3 scoped as CURRENT_ARMNN_ALNPU_BACKEND_NOT_GENERAL_YOLO_GRAPH_CAPABLE, runtime/toolchain skew UNPROVEN, and C4 NOT_RUN. The face positive uses the evidenced ALHardNPU fused/custom path, while generic YOLO slots hit LayerSupportBase rejection. Obtain a vendor-supported backend build or native compiler path before any benchmark; do not alter the frozen graph by hand."
