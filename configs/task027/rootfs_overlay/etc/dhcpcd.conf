# Task 027: eth0 is configured by ifupdown with a fixed lab address.
# Keep dhcpcd available for other interfaces, but never replace the fixed eth0
# address with DHCP during boot.
denyinterfaces eth0
duid
persistent
vendorclassid
option domain_name_servers, domain_name, domain_search
option classless_static_routes
option interface_mtu
option host_name
option rapid_commit
require dhcp_server_identifier
slaac private
